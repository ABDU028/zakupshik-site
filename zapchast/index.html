<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d0f13">
<title>Detalka</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Detalka">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f13;--bg2:#151820;--card:#1b1f29;--line:#2a2f3c;--tx:#f3f4f7;--mu:#8d93a5;--ac:#ff6a1a;--ac2:#ffb020;--ok:#2fd27a;--warn:#ffb020;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Manrope,system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{font:800 22px Unbounded,sans-serif;letter-spacing:-.5px}.logo b{color:var(--ac)}
.car-chip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{padding:0 16px}
h1{font:800 26px/1.15 Unbounded,sans-serif;margin:8px 0 14px;letter-spacing:-.5px}
h2{font:700 18px Manrope;margin:22px 0 10px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px}
.search input{border:0;background:none;padding:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff;font-weight:800;padding:14px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(255,106,26,.28);transition:transform .12s}
.btn:active{transform:scale(.97)}.btn.w{width:100%}.btn.sec{background:var(--card);border:1px solid var(--line);box-shadow:none}.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:92px}
.cat svg{width:30px;height:30px;color:var(--ac)}
.promo{margin-top:16px;border-radius:22px;padding:18px;background:radial-gradient(120% 140% at 100% 0%,#ff6a1a55,transparent 60%),linear-gradient(135deg,#1e2230,#141720);border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.promo b{font:800 17px Unbounded}.promo p{margin:6px 0 0;color:var(--mu);font-size:13px}
.feat{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}.feat::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.fc i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.res{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.res h3{margin:0 0 4px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.off{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.off:first-of-type{border-top:0}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#2a2f3c;color:#cfd3dd;white-space:nowrap}
.tag.o{background:#ff6a1a22;color:var(--ac)}.tag.g{background:#2fd27a1f;color:var(--ok)}.tag.y{background:#ffb0201f;color:var(--warn)}
.price{font:800 17px Manrope;white-space:nowrap}
.add{width:40px;height:40px;border-radius:12px;background:var(--ac);color:#fff;font-size:22px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.add.in{background:var(--ok)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,15,19,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav div{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mu);padding:4px 0;position:relative}
.nav button.on{color:var(--ac)}.nav svg{width:24px;height:24px}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--ac);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px 0 14px}.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet>div{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:3px;background:#3a4050;margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fd{from{opacity:0}}
.lbl{font-size:12.5px;color:var(--mu);font-weight:700;margin:12px 0 6px}
.opt{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card)}
.opt.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}.opt.on .dot{border:6px solid var(--ac)}
.steps{position:relative;margin:10px 0 0 6px}
.st{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px;position:relative}
.st:before{content:'';position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}.st:last-child:before{display:none}
.st i{width:16px;height:16px;border-radius:50%;background:var(--line);flex:0 0 auto;margin-top:2px;position:relative;z-index:1}
.st.done i{background:var(--ok)}.st.now i{background:var(--ac);box-shadow:0 0 0 5px #ff6a1a33}
.st.done:before{background:var(--ok)}
.empty{text-align:center;color:var(--mu);padding:50px 20px}
.empty svg{width:64px;height:64px;color:#3a4050;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:11px 16px;border-radius:14px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .25s;white-space:nowrap}
.skel{height:120px;border-radius:var(--r);margin-bottom:12px;background:linear-gradient(90deg,var(--card) 25%,#232838 50%,var(--card) 75%);background-size:300% 100%;animation:sk 1.1s infinite}
@keyframes sk{to{background-position:-150% 0}}
.demo{font-size:11px;color:#6f7588;text-align:center;margin:18px 0 0}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(90% 60% at 50% 40%,#22140c,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s,transform .5s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.fly{position:absolute;color:#ff6a1a;opacity:.18}
.fly svg{width:100%;height:100%}
@keyframes flo{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt))}100%{transform:translate(0,0) rotate(0)}}
.gearbig{width:118px;height:118px;color:var(--ac);animation:spin 6s linear infinite;filter:drop-shadow(0 0 24px #ff6a1a77)}
@keyframes spin{to{transform:rotate(360deg)}}
.sl-logo{font:800 40px Unbounded;margin-top:18px;letter-spacing:-1px;animation:pop .7s cubic-bezier(.2,1.4,.3,1) both .2s}.sl-logo b{color:var(--ac)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.slogan{height:24px;margin-top:12px;color:#c9cdd8;font-weight:700;font-size:15px;text-align:center}
.slogan span{display:block;animation:sw 1.1s both}
@keyframes sw{0%{opacity:0;transform:translateY(10px)}20%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.bar{width:160px;height:4px;border-radius:2px;background:#2a2f3c;margin-top:26px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);animation:ld 3.2s ease-in-out forwards}
@keyframes ld{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div id="splash"></div>
<div id="app"></div>
<nav class="nav"><div id="nav"></div></nav>
<script src="data.js"></script>
<script>
const D = window.DTL, LS = D.LS;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tg = n => new Intl.NumberFormat('ru-RU').format(n) + ' ₸';
const IC = {
  gear: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>',
  disc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="M17 5.5c1.5 1 2.5 2.4 3 4" stroke-width="3" stroke-linecap="round"/></svg>',
  spring: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 3h10M7 21h10M7 6l10 2.5M7 11l10-2.5M7 11l10 2.5M7 16l10-2.5M7 16l10 2.5"/></svg>',
  piston: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="9" rx="2"/><path d="M6 6h12M6 8.5h12M10 12l-1 5M14 12l1 5"/><circle cx="12" cy="19" r="2.5"/></svg>',
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v3M9 5h6v4H9zM10 9h4v6h-4zM8.5 15h7l-1 4h-5zM12 19v3"/></svg>',
  filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="16" rx="3"/><path d="M8 4v16M11 4v16M14 4v16M17 4v16" opacity=".6"/></svg>',
  lamp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 6a6 6 0 0 1 0 12H8V6z"/><path d="M14 8l6-1M14 12h7M14 16l6 1"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>',
  car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><path d="M3 12h18"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M15 5l-7 7 7 7"/></svg>',
};

/* ---------- state ---------- */
const CID = (() => { let c = LS.get('cid', ''); if (!c) { c = (crypto.randomUUID ? crypto.randomUUID() : 'c' + Date.now() + Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g, ''); LS.set('cid', c); } return c; })();
async function api(action, body) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(D.AGENT + '?action=' + action, { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ cid: CID }, body || {})) });
    const j = await r.json().catch(() => ({}));
    return { status: r.status, ...j };
  } catch (e) { return { status: 0, error: 'offline' }; } finally { clearTimeout(t); }
}
const S = {
  view: 'home', cars: LS.get('cars', []), car: LS.get('car', 0), cart: LS.get('cart', []),
  q: '', cat: null, results: null, loading: false, chosen: null, my: LS.get('my', { orders: [], requests: [] }), syncing: false,
};
const car = () => S.cars[S.car] || null;
const save = () => { LS.set('cars', S.cars); LS.set('car', S.car); LS.set('cart', S.cart); };
const carName = c => c ? `${c.brand} ${c.model}${c.year ? ' · ' + c.year : ''}` : 'Добавить авто';
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function go(v) { S.view = v; render(); window.scrollTo(0, 0); if (v === 'orders') sync(); }

/* ---------- splash ---------- */
(function splash() {
  const sp = $('#splash');
  if (sessionStorage.getItem('dtl_spl')) { sp.remove(); return; }
  try { sessionStorage.setItem('dtl_spl', 1); } catch (e) {}
  const parts = ['disc', 'spring', 'piston', 'plug', 'filter', 'lamp', 'gear', 'drop'];
  let h = '';
  for (let i = 0; i < 16; i++) {
    const p = parts[i % parts.length], s = 34 + Math.random() * 56;
    h += `<div class="fly" style="left:${Math.random() * 92}%;top:${Math.random() * 92}%;width:${s}px;height:${s}px;--dx:${(Math.random() - .5) * 80}px;--dy:${(Math.random() - .5) * 80}px;--rt:${(Math.random() - .5) * 120}deg;animation:flo ${5 + Math.random() * 4}s ease-in-out infinite">${IC[p]}</div>`;
  }
  sp.innerHTML = h + `<div class="gearbig">${IC.gear}</div><div class="sl-logo">Detal<b>ka</b></div><div class="slogan" id="slg"></div><div class="bar"><i></i></div>`;
  const sl = ['Запчасть за 2 минуты', 'Со склада в Алматы — сегодня', 'Подбор по VIN без ошибок'];
  let k = 0; const tick = () => { const e = $('#slg'); if (e) e.innerHTML = `<span>${sl[k++ % sl.length]}</span>`; };
  tick(); const iv = setInterval(tick, 1100);
  setTimeout(() => { clearInterval(iv); sp.classList.add('out'); setTimeout(() => sp.remove(), 520); }, 3300);
})();

/* ---------- views ---------- */
function topBar(title, back) {
  return `<div class="top">${back ? `<button onclick="go('${back}')" aria-label="Назад">${IC.back}</button><b style="font-size:17px">${esc(title)}</b>` : `<div class="logo">Detal<b>ka</b></div>`}
    <button class="car-chip" onclick="carSheet()">${IC.car.replace('<svg', '<svg width="18" height="18"')}<span>${esc(carName(car()))}</span></button></div>`;
}
function vHome() {
  return topBar() + `<div class="pad">
    <h1>Найдём деталь<br>и привезём сегодня</h1>
    <div class="search"><span style="color:var(--mu)">${IC.search.replace('<svg', '<svg width="20" height="20"')}</span>
      <input id="q" placeholder="Название или номер детали" enterkeyhint="search" onkeydown="if(event.key==='Enter')doSearch(this.value)">
      <button class="btn sm" onclick="doSearch($('#q').value)">Найти</button></div>
    <div class="feat" style="margin-top:12px">
      <div class="fc"><i></i>Наличие со склада в Алматы</div><div class="fc"><i></i>Доставка сегодня</div><div class="fc"><i></i>Оригинал и аналоги</div><div class="fc"><i></i>Не подошло — заберём</div></div>
    <h2>Каталог${car() ? ' для ' + esc(car().brand + ' ' + car().model) : ''}</h2>
    <div class="grid">${D.CATS.map(c => `<button class="cat" onclick="openCat('${c.id}')">${IC[c.ico]}${c.name}</button>`).join('')}</div>
    <div class="promo"><div style="flex:1"><b>Не нашли деталь?</b><p>Пришлите фото или опишите — подберём по VIN и ответим за 15 минут.</p></div>
      <button class="btn sm" onclick="reqSheet()">${IC.cam.replace('<svg', '<svg width="18" height="18"')}Заявка</button></div>
    <h2>Популярное</h2>
    <div class="feat">${['Масло 5W-30', 'Колодки', 'Амортизатор', 'Свечи', 'Аккумулятор', 'Дворники', 'Фильтр салона'].map(t => `<button class="fc" onclick="doSearch('${t}')">${esc(t)}</button>`).join('')}</div>
    <p class="demo">Тестовый режим: каталог, цены и наличие — демо</p></div>`;
}
function vResults() {
  const cats = [{ id: null, name: 'Всё' }].concat(D.CATS);
  let body;
  if (S.loading) body = '<div class="mu" style="margin:4px 0 10px">Проверяем наличие на складе…</div>' + '<div class="skel"></div>'.repeat(3);
  else if (!S.results || !S.results.length) body = `<div class="empty">${IC.box}<div><b style="color:var(--tx)">Ничего не нашли на складе</b></div><p>Отправьте заявку — найдём под заказ или в Кар Сити.</p><button class="btn" onclick="reqSheet()">Отправить заявку</button></div>`;
  else body = S.results.filter(p => !S.cat || p.cat === S.cat).map(card).join('') || '<div class="empty">В этой категории ничего</div>';
  return topBar(S.q ? `«${S.q}»` : 'Каталог', 'home') + `<div class="pad">
    <div class="search" style="margin-top:4px"><span style="color:var(--mu)">${IC.search.replace('<svg', '<svg width="20" height="20"')}</span><input id="q" value="${esc(S.q)}" placeholder="Название или номер" enterkeyhint="search" onkeydown="if(event.key==='Enter')doSearch(this.value)"></div>
    <div class="seg">${cats.map(c => `<button class="${S.cat === c.id ? 'on' : ''}" onclick="S.cat=${c.id ? `'${c.id}'` : 'null'};render()">${c.name}</button>`).join('')}</div>
    ${car() ? `<div class="mu" style="margin-bottom:10px">Показываем то, что подходит на <b style="color:var(--tx)">${esc(carName(car()))}</b></div>` : `<div class="res" style="display:flex;gap:10px;align-items:center"><span class="sp">Добавьте машину — покажем только подходящее</span><button class="btn sm" onclick="carSheet()">Добавить</button></div>`}
    ${body}</div>`;
}
function card(p) {
  const offs = p.offers.slice(0, 4);
  return `<div class="res"><h3>${esc(p.name)}</h3><div class="mu">${p.fit.length ? 'Для ' + esc(p.fit.join(', ')) : 'Универсально'} · ${p.offers.length} вариант${p.offers.length > 4 ? 'ов' : 'а'}</div>
    ${offs.map((o, i) => {
      const inCart = S.cart.some(c => c.num === o.num && c.brand === o.brand);
      return `<div class="off"><div class="sp"><div class="row" style="gap:6px;flex-wrap:wrap"><b>${esc(o.brand)}</b><span class="tag ${o.kind === 'оригинал' ? 'o' : ''}">${o.kind}</span></div>
        <div class="mu" style="font-size:12px">${esc(o.num)} · ${o.stock > 0 ? `<span style="color:var(--ok)">в наличии ${o.stock} шт</span> · ${D.ETA[o.eta]}` : `<span style="color:var(--warn)">под заказ</span> · ${D.ETA[o.eta] || '3–5 дней'}`}</div></div>
        <div class="price">${tg(o.price)}</div><button class="add ${inCart ? 'in' : ''}" onclick='toCart(${JSON.stringify({ pid: p.id, name: p.name, brand: o.brand, num: o.num, price: o.price, cost: o.cost, kind: o.kind, eta: o.eta, stock: o.stock }).replace(/'/g, '&#39;')})'>${inCart ? '✓' : '+'}</button></div>`;
    }).join('')}</div>`;
}
function vCart() {
  if (!S.cart.length) return topBar('Корзина', 'home') + `<div class="empty">${IC.cart}<div><b style="color:var(--tx)">Корзина пуста</b></div><p>Найдите деталь по названию или номеру</p><button class="btn" onclick="go('home')">В каталог</button></div>`;
  const st = D.settings(), sum = S.cart.reduce((a, c) => a + c.price * c.qty, 0);
  const del = S.dlv || 'courier', dPrice = del === 'pickup' ? 0 : del === 'region' ? 0 : (sum >= st.freeFrom ? 0 : st.delivery);
  return topBar('Корзина', 'home') + `<div class="pad">
    ${S.cart.map((c, i) => `<div class="res"><div class="row"><div class="sp"><b>${esc(c.name)}</b><div class="mu">${esc(c.brand)} · ${esc(c.num)} · ${D.ETA[c.eta]}</div></div><div class="price">${tg(c.price * c.qty)}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn sec sm" onclick="qty(${i},-1)">−</button><b>${c.qty}</b><button class="btn sec sm" onclick="qty(${i},1)">+</button><span class="sp"></span><button class="mu" onclick="qty(${i},-99)">Удалить</button></div></div>`).join('')}
    <div class="lbl">Доставка</div>
    ${[['courier', 'Курьер по Алматы', sum >= st.freeFrom ? 'бесплатно' : tg(st.delivery), 'сегодня до 21:00'], ['pickup', 'Самовывоз', 'бесплатно', 'Кар Сити, после 15:00'], ['region', 'В другой город', 'по тарифу ТК', '2–5 дней']]
      .map(([k, n, p, t]) => `<div class="opt ${del === k ? 'on' : ''}" onclick="S.dlv='${k}';render()"><span class="dot"></span><div class="sp"><b>${n}</b><div class="mu">${t}</div></div><b>${p}</b></div>`).join('')}
    <div class="lbl">Адрес и телефон</div>
    <input id="addr" placeholder="${del === 'region' ? 'Город, адрес' : 'Улица, дом, квартира'}" value="${esc(LS.get('addr', ''))}" style="margin-bottom:8px">
    <input id="phone" type="tel" placeholder="+7 7__ ___ __ __" value="${esc(LS.get('phone', ''))}">
    <div class="res" style="margin-top:14px"><div class="row"><span class="sp mu">Товары</span><b>${tg(sum)}</b></div><div class="row" style="margin-top:6px"><span class="sp mu">Доставка</span><b>${del === 'region' ? 'отдельно' : tg(dPrice)}</b></div>
      <div class="row" style="margin-top:10px;font-size:18px"><span class="sp"><b>Итого</b></span><b>${tg(sum + dPrice)}</b></div></div>
    <button class="btn w" onclick="checkout(${sum},${dPrice})">Оплатить ${tg(sum + dPrice)}</button>
    <p class="demo">Оплата через Kaspi QR / карту — в прототипе имитация</p></div>`;
}
function vOrders() {
  const os = S.my.orders || [], rq = S.my.requests || [];
  const dt = t => new Date(t).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  if (!os.length && !rq.length) return topBar('Заказы', 'home') + `<div class="empty">${IC.box}<div><b style="color:var(--tx)">${S.syncing ? 'Загружаем…' : 'Пока нет заказов'}</b></div></div>`;
  return topBar('Заказы', 'home') + `<div class="pad">
    ${rq.map(r => `<div class="res"><div class="row"><b class="sp">Заявка: ${esc(r.text.slice(0, 48))}</b><span class="tag ${r.answer ? 'g' : 'y'}">${r.answer ? 'есть ответ' : 'ищем'}</span></div>
      <div class="mu">${esc(r.car ? (r.car.brand + ' ' + r.car.model).trim() : '')} · ${dt(r.at)}</div>
      ${r.answer ? `<div style="margin-top:10px;padding:10px;border-radius:12px;background:var(--bg2);white-space:pre-wrap">${esc(r.answer)}</div>` : ''}</div>`).join('')}
    ${os.map(o => `<div class="res"><div class="row"><b class="sp">Заказ №${o.id}</b><b>${tg(o.total)}</b></div>
      <div class="mu">${o.items.map(i => esc(i.name + ' · ' + i.brand)).join(', ')} · ${dt(o.at)}</div>
      ${o.step < 0 ? '<div class="tag y" style="display:inline-block;margin-top:10px">Заказ отменён — деньги вернём</div>' :
        `<div class="steps">${D.ORDER_STEPS.map((s, k) => `<div class="st ${k < o.step ? 'done' : k === o.step ? 'now' : ''}"><i></i><div>${s}</div></div>`).join('')}</div>`}</div>`).join('')}</div>`;
}
function vGarage() {
  return topBar('Гараж', 'home') + `<div class="pad">
    ${S.cars.map((c, i) => `<div class="opt ${i === S.car ? 'on' : ''}" onclick="S.car=${i};save();render()"><span class="dot"></span><div class="sp"><b>${esc(c.brand + ' ' + c.model)}</b><div class="mu">${c.year || ''}${c.vin ? ' · VIN ' + esc(c.vin) : ''}</div></div><button class="mu" onclick="event.stopPropagation();S.cars.splice(${i},1);S.car=0;save();render()">✕</button></div>`).join('') || '<div class="empty">Добавьте свою машину — будем показывать только подходящие детали</div>'}
    <button class="btn w" onclick="carSheet()">+ Добавить машину</button>
    <h2>Поддержка</h2><div class="res">Пишите нам в чат заявки или звоните — ответим за 15 минут.<br><span class="mu">Ежедневно 9:00–21:00</span></div></div>`;
}
function nav() {
  const n = S.cart.reduce((a, c) => a + c.qty, 0);
  const it = [['home', 'Главная', 'home'], ['results', 'Каталог', 'search'], ['cart', 'Корзина', 'cart'], ['orders', 'Заказы', 'box'], ['garage', 'Гараж', 'car']];
  $('#nav').innerHTML = it.map(([v, t, i]) => `<button class="${S.view === v ? 'on' : ''}" onclick="${v === 'results' ? 'openCat(null)' : `go('${v}')`}">${IC[i]}${t}${v === 'cart' && n ? `<span class="badge">${n}</span>` : ''}</button>`).join('');
}
function render() {
  $('#app').innerHTML = ({ home: vHome, results: vResults, cart: vCart, orders: vOrders, garage: vGarage })[S.view]();
  nav();
}

/* ---------- actions ---------- */
async function doSearch(q) {
  S.q = (q || '').trim(); S.cat = null; S.loading = true; S.results = null; go('results');
  S.results = await D.stockSearch(S.q, car()); S.loading = false; render();
}
async function openCat(c) {
  S.q = ''; S.cat = c; S.loading = true; go('results');
  S.results = await D.stockSearch('', car()); S.loading = false; render();
}
function toCart(o) {
  const i = S.cart.findIndex(c => c.num === o.num && c.brand === o.brand);
  if (i >= 0) { S.cart.splice(i, 1); toast('Убрано из корзины'); }
  else { S.cart.push({ ...o, qty: 1 }); toast('Добавлено в корзину'); }
  save(); render();
}
function qty(i, d) { const c = S.cart[i]; c.qty += d; if (c.qty <= 0 || d === -99) S.cart.splice(i, 1); save(); render(); }
function checkout(sum, dPrice) {
  const addr = ($('#addr').value || '').trim(), phone = $('#phone').value.trim();
  if ((S.dlv || 'courier') !== 'pickup' && addr.length < 3) return toast('Укажите адрес');
  if (phone.replace(/\D/g, '').length < 10) return toast('Укажите телефон');
  LS.set('addr', addr); LS.set('phone', phone);
  sheet(`<div style="text-align:center"><div class="lbl" style="margin-top:0">Оплата</div><h2 style="margin:6px 0 14px">${tg(sum + dPrice)}</h2>
    <div style="width:180px;height:180px;margin:0 auto 14px;border-radius:18px;background:#fff;display:grid;place-items:center;color:#111;font-weight:800">Kaspi QR<br><span style="font-size:11px;font-weight:600">(тест — платить не нужно)</span></div>
    <p class="mu">Отсканируйте в приложении Kaspi.kz</p><button class="btn w" id="paid">Я оплатил</button></div>`);
  $('#paid').onclick = () => placeOrder(false);
}
async function placeOrder(accept) {
  const b = $('#paid'); if (b) { b.disabled = true; b.textContent = 'Оформляем…'; }
  const r = await api('order', { phone: LS.get('phone', ''), addr: LS.get('addr', ''), delivery: S.dlv || 'courier', car: car(), accept,
    items: S.cart.map(c => ({ brand: c.brand, num: c.num, qty: c.qty, price: c.price, name: c.name })) });
  if (r.ok) { S.cart = []; save(); closeSheet(); toast('Заказ №' + r.id + ' оформлен'); go('orders'); return; }
  if (r.error === 'changed') {
    sheet(`<h2 style="margin-top:0">Пока вы выбирали, на складе изменилось</h2>${r.changed.map(t => `<div class="res" style="margin-bottom:8px">${esc(t)}</div>`).join('')}
      <button class="btn w" id="paid">Согласен, оформить</button><button class="btn sec w" style="margin-top:8px" onclick="closeSheet()">Вернуться в корзину</button>`);
    S.cart = (r.items || []).map(i => ({ ...i, qty: i.qty })); save();
    $('#paid').onclick = () => placeOrder(true); return;
  }
  if (b) { b.disabled = false; b.textContent = 'Я оплатил'; }
  toast(r.status === 0 ? 'Нет связи — попробуйте ещё раз' : r.error === 'addr' ? 'Укажите адрес' : r.error === 'phone' ? 'Проверьте телефон' : 'Не получилось, попробуйте ещё раз');
}

/* ---------- sheets ---------- */
function sheet(h) { closeSheet(); const d = document.createElement('div'); d.className = 'sheet'; d.id = 'sheet'; d.innerHTML = `<div><div class="grab"></div>${h}</div>`; d.onclick = e => { if (e.target === d) closeSheet(); }; document.body.appendChild(d); }
function closeSheet() { const s = $('#sheet'); if (s) s.remove(); }
function carSheet() {
  sheet(`<h2 style="margin-top:0">Ваша машина</h2>
    <div class="lbl">По VIN — точнее всего</div>
    <div class="row"><input id="vin" maxlength="17" placeholder="17 знаков, например JTNB…" style="text-transform:uppercase"><button class="btn sm" onclick="vinGo()">OK</button></div>
    <div id="vinr" class="mu" style="margin-top:6px"></div>
    <div class="lbl">Или выберите</div>
    <select id="br" onchange="mdl()"><option value="">Марка</option>${Object.keys(D.BRANDS).map(b => `<option>${b}</option>`).join('')}</select>
    <div class="row" style="margin-top:8px"><select id="md"><option value="">Модель</option></select><select id="yr" style="max-width:120px"><option value="">Год</option>${Array.from({ length: 27 }, (_, i) => 2026 - i).map(y => `<option>${y}</option>`).join('')}</select></div>
    <button class="btn w" style="margin-top:14px" onclick="carAdd()">Сохранить</button>`);
}
function mdl() { const b = $('#br').value; $('#md').innerHTML = '<option value="">Модель</option>' + (D.BRANDS[b] || []).map(m => `<option>${m}</option>`).join(''); }
function vinGo() {
  const r = D.decodeVin($('#vin').value);
  if (!r.ok) return $('#vinr').textContent = r.err;
  $('#vin').value = r.vin;
  if (r.brand) { $('#br').value = r.brand; mdl(); }
  if (r.year) $('#yr').value = r.year;
  $('#vinr').innerHTML = r.brand ? `Определили: <b style="color:var(--tx)">${r.brand}${r.year ? ', ' + r.year : ''}</b>. Выберите модель.` : 'Марку не определили — выберите вручную.';
}
function carAdd() {
  const brand = $('#br').value, model = $('#md').value, year = $('#yr').value, v = D.decodeVin($('#vin').value);
  if (!brand || !model) return toast('Выберите марку и модель');
  S.cars.push({ brand, model, year: year ? +year : null, vin: v.ok ? v.vin : '' }); S.car = S.cars.length - 1; save(); closeSheet(); toast('Машина сохранена');
  if (S.view === 'results') openCat(S.cat); else render();
}
function reqSheet() {
  sheet(`<h2 style="margin-top:0">Заявка на деталь</h2><p class="mu" style="margin-top:-4px">Ответим за 15 минут: наличие, цена, срок.</p>
    <div class="lbl">Машина</div><button class="opt on" style="width:100%" onclick="carSheet()"><span class="dot"></span><b>${esc(carName(car()))}</b></button>
    <div class="lbl">Что нужно</div><textarea id="rt" rows="3" placeholder="Например: передний правый амортизатор, стучит"></textarea>
    <div class="lbl">Фото детали или номера (необязательно)</div>
    <label class="btn sec w" style="cursor:pointer">${IC.cam.replace('<svg', '<svg width="18" height="18"')}<span id="phn">Прикрепить фото</span><input type="file" accept="image/*" hidden onchange="photoPick(this)"></label>
    <div class="lbl">Телефон для ответа</div><input id="rp" type="tel" value="${esc(LS.get('phone', ''))}" placeholder="+7 7__ ___ __ __">
    <button class="btn w" style="margin-top:14px" onclick="reqSend()">Отправить</button>`);
}
let reqPhoto = null;
async function photoPick(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  try {
    const img = await createImageBitmap(f); const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); reqPhoto = c.toDataURL('image/jpeg', .72);
    $('#phn').textContent = 'Фото прикреплено ✓';
  } catch (e) { reqPhoto = null; toast('Не удалось прочитать фото'); }
}
async function reqSend() {
  const text = $('#rt').value.trim(), phone = $('#rp').value.trim();
  if (text.length < 3) return toast('Опишите деталь');
  if (phone.replace(/\D/g, '').length < 10) return toast('Укажите телефон');
  LS.set('phone', phone);
  const r = await api('request', { text, phone, car: car(), photo: reqPhoto });
  if (!r.ok) return toast(r.status === 0 ? 'Нет связи — попробуйте ещё раз' : 'Не получилось отправить');
  reqPhoto = null; closeSheet(); toast('Заявка отправлена'); go('orders');
}
async function sync() {
  if (S.syncing) return; S.syncing = true;
  const r = await api('sync', {}); S.syncing = false;
  if (r.orders) {
    const before = JSON.stringify(S.my); S.my = { orders: r.orders, requests: r.requests }; LS.set('my', S.my);
    if (S.view === 'orders' && before !== JSON.stringify(S.my)) render();
  }
}
setInterval(() => { if (S.view === 'orders' && !document.hidden) sync(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.view === 'orders') sync(); });
render();
</script>
</body>
</html>
