  const myEv = evs.filter(e => e.pid === x.pid);
  const chatTs = (x.chat || []).map(m => m.ts || 0);
  const pendingMsgs = myEv.filter(e => e.kind === 'msg' && !(x.chat || []).some(m => m.r === 'mgr' && m.t === (e.data || {}).text));
  let h = `<div class="ch-head"><button class="back" data-a="back">‹</button><div class="who"><b>${esc(x.name || 'Без имени')}</b>
     <div class="sm">${phone ? `<a href="tel:${phone}">📞 ${esc(x.phone)}</a> · <a href="https://wa.me/${wa}" target="_blank">WhatsApp</a>` : '<span class="mute">телефона нет</span>'}</div></div>
     <span class="chip ${s.c}">${esc(s.t)}</span></div>
   <div class="facts sm">${x.area ? `<span>${esc(String(x.area).replace('.', ','))} м²</span>` : ''}${x.price ? `<span>Проект ${fmt(x.price)} ₸</span>` : ''}
     ${[1, 2, 3].map(b => `<span class="${paid[b] ? 'okc' : ''}">Блок ${b}${sums[b] ? ' · ' + fmt(sums[b]) + ' ₸' : ''} ${paid[b] ? '✓ оплачен' : x.wait_pay == b ? '— ждёт оплаты' : ''}</span>`).join('')}
     <span>Этап: ${esc(STG[x.stage] || x.stage || '—')}</span>${obm[x.pid] ? `<span class="okc">обмер v${obm[x.pid].ver}</span>` : ''}</div>`;
  // действия
  h += `<div class="acts">`;
  if (x.wait_pay) h += `<button class="btn ok" data-paid="${x.wait_pay}">✓ Оплата получена — блок ${x.wait_pay} · ${fmt(sums[x.wait_pay])} ₸</button>`;
  h += `<label class="btn ghost">${obm[x.pid] ? 'Загрузить новый DXF' : 'Загрузить DXF обмера'}<input type="file" accept=".dxf" data-dxf="${x.pid}" hidden></label>`;
  if (x._noSync) h += `<span class="sm mute">Клиент на старой версии приложения — чат не виден</span>`;
  h += `</div>`;
  if (o.length) h += `<div class="reqs">${o.map(q => `<div class="req"><b>${esc(KIND[q.kind] || q.kind)}</b> <span class="mute sm">${tm(q.created_at)}</span> ${q.note ? `<div class="sm">${esc(q.note)}</div>` : ''}${q.when_text ? `<div class="sm">когда: ${esc(q.when_text)}</div>` : ''}${q.address ? `<div class="sm">${esc(q.city || '')} ${esc(q.address)}</div>` : ''}<button class="lnk" data-st="done" data-id="${q.id}">✓ сделано</button></div>`).join('')}</div>`;
  if (files.length) h += `<details class="files" ${o.some(q => q.kind === 'obmer') ? 'open' : ''}><summary class="sm">Фото рисунка (${files.reduce((a, q) => a + q.files.length, 0)})</summary><div class="thumbs">${files.map(q => q.files.map(f => `<img src="${f}" data-zoom="1" alt="">`).join('')).join('')}</div></details>`;
  if (parsed[x.pid]) h += preview(x.pid);
  // переписка
  h += `<div class="msgs" id="msgs">`;
  (x.chat || []).forEach(m => {
    if (m.r === 'sys' || m.r === 'ap') { h += `<div class="sysm">${esc(m.t)}${m.ts ? ` <span>${tm(m.ts)}</span>` : ''}</div>`; return; }
    const cls = m.r === 'me' ? 'cl' : m.r === 'mgr' ? 'mg' : 'ai';
    const who = m.r === 'me' ? (x.name || 'Клиент') : m.r === 'mgr' ? 'Менеджер' : 'ИИ-дизайнер';
    h += `<div class="b ${cls}"><div class="w">${esc(who)} · ${tm(m.ts)}</div>${m.i ? `<div class="sm mute">📷 ${m.i} фото</div>` : ''}${esc(m.t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}</div>`;
  });
  if (!(x.chat || []).length) h += `<div class="sysm">Переписки пока нет</div>`;
  pendingMsgs.forEach(e => { h += `<div class="b mg pend"><div class="w">Менеджер · ${tm(e.created_at)}</div>${esc(e.data.text)}<div class="sm">⏳ дойдёт, когда клиент откроет приложение</div></div>`; });
  if (x.needs_reply) h += `<div class="sysm red">Клиент ждёт ответа</div>`;
  h += `</div><div class="composer"><textarea id="mtext" rows="2" placeholder="Написать клиенту от менеджера…"></textarea><button class="btn" data-a="msg">Отправить</button></div>`;
  return h;
}

function preview(pid) {
  const A = parsed[pid];
  if (A.error) return `<p class="warn">${esc(A.error)}</p>`;
  return `<div class="prev card"><div class="plan">${A.svg}</div><div>
    <b>Как увидит клиент</b>${A.warn.map(w => `<div class="warn">${esc(w)}</div>`).join('')}
    <table><tr><th>Помещение</th><th>м²</th><th>Потолок</th></tr>
    ${A.rooms.map((x, i) => `<tr><td><input value="${esc(x.name)}" data-rn="${i}"></td><td>${x.area_m2}</td><td><input value="${x.h_mm || ''}" placeholder="2700" data-rh="${i}" style="width:80px"></td></tr>`).join('')}</table>
    <p class="sm">Итого площадь: <input value="${A.area || ''}" id="ob_area" style="width:90px"> м² ${A.rooms.length ? '' : '<span class="mute">(введи вручную)</span>'}</p>
    <p class="sm mute">Окна: ${A.openings.filter(o => o.kind === 'window').length} · двери/проёмы: ${A.openings.filter(o => o.kind !== 'window').length} · стояки: ${A.risers.length} · щиток: ${A.panels.length ? 'да' : 'нет'}</p>
    <textarea id="ob_note" rows="2" style="width:100%" placeholder="Примечание для клиента (необязательно)"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn ok" data-send="${pid}">Отправить клиенту на утверждение</button><button class="btn ghost" data-a="cancelDxf">Отмена</button></div></div></div>`;
}
async function onDXF(pid, file) {
  try {
    const dxf = parseDXF(decodeDXF(await file.arrayBuffer()));
    const A = analyze(flatten(dxf));
    if (!A.error) A.svg = renderSVG(A);
    A.file = file.name; parsed[pid] = A;
  } catch (e) { parsed[pid] = { error: 'Не получилось прочитать файл: ' + (e.message || e) + '. Сохрани как DXF.' }; }
  render();
}
async function sendObmer(pid) {
  const A = parsed[pid]; if (!A || A.error) return;
  document.querySelectorAll('[data-rn]').forEach(inp => { A.rooms[+inp.dataset.rn].name = inp.value.trim() || 'Помещение'; });
  document.querySelectorAll('[data-rh]').forEach(inp => { A.rooms[+inp.dataset.rh].h_mm = parseInt(inp.value, 10) || null; });
  const area = parseFloat(String(document.getElementById('ob_area').value).replace(',', '.')) || A.area;
  if (!area) { alert('Укажи площадь'); return; }
  const note = document.getElementById('ob_note').value.trim();
  const hs = A.rooms.map(x => x.h_mm).filter(Boolean);
  const data = { source: 'dxf', file: A.file, area: Math.round(area * 10) / 10, ceiling_mm: hs.length ? Math.max(...hs) : null,
    rooms: A.rooms.map(x => ({ name: x.name, h_mm: x.h_mm, area_m2: x.area_m2, poly: x.poly })), openings: A.openings, risers: A.risers, panels: A.panels, vents: A.vents,
    total_w_mm: Math.round(A.bbox[2] - A.bbox[0]), total_d_mm: Math.round(A.bbox[3] - A.bbox[1]), notes: note || 'Обмерный план начерчен специалистом по вашему рисунку. Точность ±10–20 мм.', svg: A.svg };
  const ver = obm[pid] ? obm[pid].ver + 1 : 1;
  const { error } = await SB.from('d3k_obmer').upsert({ pid, ver, data, updated_at: new Date().toISOString() });
  if (error) { alert('Не отправилось: ' + error.message); return; }
  await SB.from('d3k_requests').update({ status: 'done' }).eq('pid', pid).eq('kind', 'obmer');
  delete parsed[pid]; alert('Обмер отправлен клиенту (версия ' + ver + '). В приложении появится в течение минуты.'); load();
}
async function markPaid(b) {
  const x = projects.find(p => p.pid === sel); if (!x) return;
  const sum = (x.sums || {})[b];
  if (!confirm(`Подтвердить: клиент ${x.name || ''} оплатил блок ${b} — ${fmt(sum)} ₸?\n\nКлиенту придёт «Оплата получена», и ИИ начнёт следующий этап.`)) return;
  const { error } = await SB.from('d3k_events').insert({ pid: x.pid, kind: 'paid', data: { block: b, sum } });
  if (error) { alert('Ошибка: ' + error.message); return; }
  await SB.from('d3k_requests').update({ status: 'done' }).eq('pid', x.pid).in('kind', ['pay', 'callback']);
  await SB.from('d3k_projects').update({ wait_pay: null, paid: Object.assign({}, x.paid, { [b]: true }) }).eq('pid', x.pid);
  load();
}
async function sendMsg() {
  const ta = document.getElementById('mtext'), text = (ta.value || '').trim(); if (!text || !sel) return;
  const { error } = await SB.from('d3k_events').insert({ pid: sel, kind: 'msg', data: { text } });
  if (error) { alert('Ошибка: ' + error.message); return; }
  ta.value = ''; load();
}
app.addEventListener('click', async e => {
  const t = e.target.closest('[data-f],[data-p],[data-a],[data-st],[data-send],[data-zoom],[data-paid]'); if (!t) return;
  if (t.dataset.f) { filter = t.dataset.f; render(); }
  else if (t.dataset.p) { sel = t.dataset.p; markSeen(sel); render(); }
  else if (t.dataset.a === 'back') { sel = null; render(); }
  else if (t.dataset.a === 'msg') sendMsg();
  else if (t.dataset.a === 'cancelDxf') { delete parsed[sel]; render(); }
  else if (t.dataset.paid) markPaid(+t.dataset.paid);
  else if (t.dataset.st) { await SB.from('d3k_requests').update({ status: t.dataset.st }).eq('id', +t.dataset.id); load(); }
  else if (t.dataset.send) sendObmer(t.dataset.send);
  else if (t.dataset.zoom) { const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${t.src}">`; z.onclick = () => z.remove(); document.body.appendChild(z); }
});
app.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.dxf && t.files[0]) onDXF(t.dataset.dxf, t.files[0]); });
app.addEventListener('keydown', e => { if (e.target.id === 'mtext' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendMsg(); });
function loginUI(msg) {
  app.className = '';
  app.innerHTML = `<div class="card login"><h3>Вход для персонала</h3><p class="sm mute">Тот же логин и пароль, что в панели Закупщика.</p>${msg ? `<p class="warn">${esc(msg)}</p>` : ''}<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Пароль"><button class="btn" id="go" style="width:100%">Войти</button></div>`;
  document.getElementById('go').onclick = async () => { const { error } = await SB.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }); if (error) loginUI('Неверный email или пароль'); else start(); };
}
async function start() {
  const { data } = await SB.auth.getSession();
  if (!data.session) return loginUI();
  document.getElementById('who').textContent = data.session.user.email; const out = document.getElementById('out'); out.hidden = false; out.onclick = async () => { await SB.auth.signOut(); location.reload(); };
  load();
  // обновление каждые 15 с, но не трогаем экран, пока менеджер печатает или смотрит DXF
  setInterval(() => { const ta = document.getElementById('mtext'); if (Object.keys(parsed).length || (ta && ta.value) || document.activeElement && document.activeElement.tagName === 'INPUT') return; load(); }, 15000);
}
window.D3K_TEST = { parseDXF, decodeDXF, flatten, analyze, renderSVG };
start();
</script>
