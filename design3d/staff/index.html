.login{max-width:360px;margin:60px auto}.login input{width:100%;margin-bottom:10px}
.prev{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:12px}

  A.draw.forEach(o => {
    const c = col(o.color), dash = /DASH|HIDDEN|ПУНКТ/i.test(o.lt || '') ? ` stroke-dasharray="${sw * 8} ${sw * 5}"` : '';
    const w = isLayer(o, /СТЕН|WALL|ГАЗО|МОНОЛ/) || (o.color === 7 && !o.text) ? sw * 2.2 : sw * 1.2;
    if (o.type === 'LINE') g.push(`<line x1="${X(o.pts[0][0])}" y1="${Y(o.pts[0][1])}" x2="${X(o.pts[1][0])}" y2="${Y(o.pts[1][1])}" stroke="${c}" stroke-width="${w}"${dash}/>`);
    else if (o.pts && o.pts.length > 1) g.push(`<${o.closed ? 'polygon' : 'polyline'} points="${o.pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}"${dash}/>`);
    else if (o.type === 'CIRCLE') g.push(`<circle cx="${X(o.x)}" cy="${Y(o.y)}" r="${o.r.toFixed(1)}" fill="none" stroke="${c}" stroke-width="${w}"/>`);
    else if (o.type === 'ARC') {
      let a0 = o.a0 * Math.PI / 180, a1 = o.a1 * Math.PI / 180; if (a1 < a0) a1 += 2 * Math.PI;
      const p0 = [o.x + o.r * Math.cos(a0), o.y + o.r * Math.sin(a0)], p1 = [o.x + o.r * Math.cos(a1), o.y + o.r * Math.sin(a1)];
      g.push(`<path d="M${X(p0[0])} ${Y(p0[1])} A${o.r.toFixed(1)} ${o.r.toFixed(1)} 0 ${a1 - a0 > Math.PI ? 1 : 0} 0 ${X(p1[0])} ${Y(p1[1])}" fill="none" stroke="${c}" stroke-width="${sw}"/>`);
    } else if (o.text) g.push(`<text transform="translate(${X(o.x)} ${Y(o.y)}) rotate(${-(o.rot || 0)})" font-size="${(o.h || 150).toFixed(0)}" fill="${c === '#b58a00' ? '#8a6a00' : c}" font-family="Arial" ${o.center ? 'text-anchor="middle"' : ''}>${esc(o.text)}</text>`);
  });
  const pw = 1600, ph = Math.round(pw * H / W);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" width="${pw}" height="${ph}"><rect width="100%" height="100%" fill="#fffdf9"/>${g.join('')}</svg>`;
}

/* ================== интерфейс ================== */
async function load() {
  const { data, error } = await SB.from('d3k_requests').select('*').order('created_at', { ascending: false }).limit(200);
  if (error) { app.innerHTML = `<div class="card">Ошибка: ${esc(error.message)}</div>`; return; }
  rows = data || [];
  const pids = [...new Set(rows.filter(r => r.pid).map(r => r.pid))];
  if (pids.length) { const { data: ob } = await SB.from('d3k_obmer').select('pid,ver,updated_at').in('pid', pids); (ob || []).forEach(o => { rows.filter(r => r.pid === o.pid).forEach(r => r._ob = o); }); }
  render();
}
function render() {
  const list = rows.filter(r => tab === 'all' ? true : tab === 'obmer' ? r.kind === 'obmer' && r.status !== 'done' : tab === 'other' ? r.kind !== 'obmer' && r.status !== 'done' : r.status === 'done');
  const cnt = k => rows.filter(r => k === 'obmer' ? r.kind === 'obmer' && r.status !== 'done' : k === 'other' ? r.kind !== 'obmer' && r.status !== 'done' : k === 'done' ? r.status === 'done' : true).length;
  app.innerHTML = `<div class="tabs">${[['obmer', 'Ждут обмера'], ['other', 'Звонки и вопросы'], ['done', 'Готово'], ['all', 'Все']].map(([k, n]) => `<button class="${tab === k ? 'on' : ''}" data-tab="${k}">${n} · ${cnt(k)}</button>`).join('')}<button data-a="reload">↻ Обновить</button></div>` +
    (list.length ? list.map(card).join('') : `<div class="card mute">Здесь пусто.</div>`);
}
function card(r) {
  const p = r.project || {}, phone = (r.phone || '').replace(/[^\d+]/g, '');
  const st = r.status === 'done' ? '<span class="pill ok">готово</span>' : r.status === 'work' ? '<span class="pill work">в работе</span>' : '<span class="pill">новая</span>';
  let h = `<div class="card" id="c${r.id}"><div class="row"><b>${esc(KIND[r.kind] || r.kind)}</b>${st}<span class="mute sm">#${r.id} · ${new Date(r.created_at).toLocaleString('ru-RU')}</span></div>
   <div class="row sm" style="margin-top:6px"><span>${esc(r.name || 'без имени')}</span>${phone ? `<a href="tel:${phone}">${esc(r.phone)}</a><a href="https://wa.me/${phone.replace('+', '')}" target="_blank">WhatsApp</a>` : ''}${r.city ? `<span>${esc(r.city)}</span>` : ''}${r.address ? `<span>${esc(r.address)}</span>` : ''}${r.when_text ? `<span>когда: ${esc(r.when_text)}</span>` : ''}</div>
   ${r.note ? `<p class="sm" style="margin:8px 0 0">${esc(r.note)}</p>` : ''}
   ${p.area ? `<p class="sm mute" style="margin:6px 0 0">Площадь (клиент): ${esc(p.area)} м² · этап: ${esc(r.stage || '')}</p>` : ''}
   ${Array.isArray(p.last) && p.last.length ? `<details class="sm" style="margin-top:6px"><summary>Последние сообщения</summary>${p.last.map(x => `<div>${esc(x)}</div>`).join('')}</details>` : ''}
   ${Array.isArray(r.files) && r.files.length ? `<div class="thumbs">${r.files.map((f, i) => `<img src="${f}" data-zoom="${r.id}:${i}" alt="">`).join('')}</div>` : ''}`;
  if (r.kind === 'obmer') {
    h += r.pid ? `<div class="row" style="margin-top:8px">${r._ob ? `<span class="pill ok">обмер отправлен · версия ${r._ob.ver}</span>` : ''}<label class="btn ghost">Загрузить DXF<input type="file" accept=".dxf" data-dxf="${r.id}" hidden></label></div>` : `<p class="warn">У заявки нет id проекта (старая версия приложения) — отправить обмер в приложение нельзя.</p>`;
    if (parsed[r.id]) h += preview(r);
  }
  h += `<div class="row" style="margin-top:10px">${r.status !== 'work' && r.status !== 'done' ? `<button class="btn ghost" data-st="work" data-id="${r.id}">Взять в работу</button>` : ''}${r.status !== 'done' ? `<button class="btn ghost" data-st="done" data-id="${r.id}">Готово</button>` : `<button class="btn ghost" data-st="new" data-id="${r.id}">Вернуть в работу</button>`}</div></div>`;
  return h;
}
function preview(r) {
  const A = parsed[r.id];
  if (A.error) return `<p class="warn">${esc(A.error)}</p>`;
  return `<div class="prev"><div class="plan">${A.svg}</div><div>
    <b>Как увидит клиент</b>${A.warn.map(w => `<div class="warn">${esc(w)}</div>`).join('')}
    <table><tr><th>Помещение</th><th>м²</th><th>Потолок</th></tr>
    ${A.rooms.map((x, i) => `<tr><td><input value="${esc(x.name)}" data-rn="${r.id}:${i}"></td><td>${x.area_m2}</td><td><input value="${x.h_mm || ''}" placeholder="2700" data-rh="${r.id}:${i}" style="width:80px"></td></tr>`).join('')}</table>
    <p class="sm">Итого площадь: <input value="${A.area || ''}" data-area="${r.id}" style="width:90px"> м² ${A.rooms.length ? '' : '<span class="mute">(введи вручную)</span>'}</p>
    <p class="sm mute">Окна: ${A.openings.filter(o => o.kind === 'window').length} · двери/проёмы: ${A.openings.filter(o => o.kind !== 'window').length} · стояки: ${A.risers.length} · щиток: ${A.panels.length ? 'да' : 'нет'}</p>
    <textarea data-note="${r.id}" rows="2" style="width:100%" placeholder="Примечание для клиента (необязательно)"></textarea>
    <button class="btn ok" data-send="${r.id}" style="margin-top:8px;width:100%">Отправить клиенту на утверждение</button></div></div>`;
}
async function onDXF(id, file) {
  try {
    const buf = await file.arrayBuffer();
    const dxf = parseDXF(decodeDXF(buf));
    const A = analyze(flatten(dxf));
    if (!A.error) A.svg = renderSVG(A);
    A.file = file.name; parsed[id] = A;
  } catch (e) { parsed[id] = { error: 'Не получилось прочитать файл: ' + (e.message || e) + '. Сохрани как DXF.' }; }
  render(); document.getElementById('c' + id)?.scrollIntoView({ behavior: 'smooth' });
}
async function sendObmer(id) {
  const r = rows.find(x => x.id === id), A = parsed[id]; if (!r || !A || A.error) return;
  document.querySelectorAll(`[data-rn^="${id}:"]`).forEach(inp => { A.rooms[+inp.dataset.rn.split(':')[1]].name = inp.value.trim() || 'Помещение'; });
  document.querySelectorAll(`[data-rh^="${id}:"]`).forEach(inp => { const v = parseInt(inp.value, 10); A.rooms[+inp.dataset.rh.split(':')[1]].h_mm = v || null; });
  const area = parseFloat(String(document.querySelector(`[data-area="${id}"]`).value).replace(',', '.')) || A.area;
  if (!area) { alert('Укажи площадь'); return; }
  const note = document.querySelector(`[data-note="${id}"]`).value.trim();
  const hs = A.rooms.map(x => x.h_mm).filter(Boolean);
  const data = { source: 'dxf', file: A.file, area: Math.round(area * 10) / 10, ceiling_mm: hs.length ? Math.max(...hs) : null,
    rooms: A.rooms.map(x => ({ name: x.name, h_mm: x.h_mm, area_m2: x.area_m2, poly: x.poly })), openings: A.openings, risers: A.risers, panels: A.panels, vents: A.vents,
    total_w_mm: Math.round(A.bbox[2] - A.bbox[0]), total_d_mm: Math.round(A.bbox[3] - A.bbox[1]), notes: note || 'Обмерный план начерчен специалистом по вашему рисунку. Точность ±10–20 мм.', svg: A.svg };
  const ver = r._ob ? r._ob.ver + 1 : 1;
  const { error } = await SB.from('d3k_obmer').upsert({ pid: r.pid, ver, data, updated_at: new Date().toISOString() });
  if (error) { alert('Не отправилось: ' + error.message); return; }
  await SB.from('d3k_requests').update({ status: 'done' }).eq('id', id);
  delete parsed[id]; alert('Обмер отправлен клиенту (версия ' + ver + '). В приложении он появится в течение минуты.'); load();
}
app.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-a],[data-st],[data-send],[data-zoom]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.a === 'reload') load();
  else if (t.dataset.st) { await SB.from('d3k_requests').update({ status: t.dataset.st }).eq('id', +t.dataset.id); load(); }
  else if (t.dataset.send) sendObmer(+t.dataset.send);
  else if (t.dataset.zoom) { const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${t.src}">`; z.onclick = () => z.remove(); document.body.appendChild(z); }
});
app.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.dxf && t.files[0]) onDXF(+t.dataset.dxf, t.files[0]); });
function loginUI(msg) {
  app.innerHTML = `<div class="card login"><h3>Вход для персонала</h3><p class="sm mute">Тот же логин и пароль, что в панели Закупщика.</p>${msg ? `<p class="warn">${esc(msg)}</p>` : ''}<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Пароль"><button class="btn" id="go" style="width:100%">Войти</button></div>`;
  document.getElementById('go').onclick = async () => { const { error } = await SB.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }); if (error) loginUI('Неверный email или пароль'); else start(); };
}
async function start() {
  const { data } = await SB.auth.getSession();
  if (!data.session) return loginUI();
  document.getElementById('who').textContent = data.session.user.email; const out = document.getElementById('out'); out.hidden = false; out.onclick = async () => { await SB.auth.signOut(); location.reload(); };
  load(); setInterval(() => { if (!Object.keys(parsed).length) load(); }, 60000);
}
window.D3K_TEST = { parseDXF, decodeDXF, flatten, analyze, renderSVG };
start();
</script>
