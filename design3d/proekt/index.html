<style>

}

  --elec:#F08A4B; --light:#E3B341; --cold:#5AA7F0; --hot:#F2706B; --waste:#B9A387; --heat:#F27D78; --lam:#C39463; --tile:#8E9CAA;
  --ok:#5CC08A; --warn:#F0A060; --aero:#3B3A33;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --sheet:#151C23; --ink:#DCE3EA; --ink2:#9AA8B5; --faint:#3A4651; --rule:#27313B;
  --accent:#86AAF0; --wall2:#34424F; --hatch:#71808D; --furn:#1C252E;
  --elec:#F08A4B; --light:#E3B341; --cold:#5AA7F0; --hot:#F2706B; --waste:#B9A387; --heat:#F27D78; --lam:#C39463; --tile:#8E9CAA;

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1480px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:end;justify-content:space-between;margin-bottom:18px}

nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:16px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);font:500 13px var(--f-body);padding:10px 12px 9px;cursor:pointer;display:flex;gap:7px;align-items:baseline}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}

.board{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;position:relative;min-width:0}

.rsm{font-family:var(--f-disp);font-size:120px;fill:var(--ink2)}
.tag{font-family:var(--f-mono);font-size:100px;fill:var(--accent)}

.sz{font-family:var(--f-mono);font-size:96px;fill:var(--ink2)}
.cl line{stroke-width:9}

.lab-e{font-family:var(--f-mono);font-size:92px;fill:var(--elec)}

.sym-l{stroke:var(--light);stroke-width:12;fill:var(--sheet)}

.ltr{font-family:var(--f-mono);font-size:105px;fill:var(--light);font-weight:500}
.led{stroke:var(--light);stroke-width:34;stroke-dasharray:70 40;fill:none}

.p-c{stroke:var(--cold);stroke-width:24;fill:none;stroke-linejoin:round}
.p-h{stroke:var(--hot);stroke-width:24;fill:none;stroke-linejoin:round}
.p-k{stroke:var(--waste);stroke-width:34;fill:none;stroke-dasharray:90 40;stroke-linejoin:round}
.p-k110{stroke:var(--waste);stroke-width:60;fill:none;stroke-linejoin:round;opacity:.85}
.pt-c{fill:var(--cold)} .pt-h{fill:var(--hot)} .pt-k{fill:var(--waste)}
.lab-c{font-family:var(--f-mono);font-size:92px;fill:var(--cold)}
.lab-h{font-family:var(--f-mono);font-size:92px;fill:var(--hot)}
.lab-k{font-family:var(--f-mono);font-size:92px;fill:var(--waste)}
.box{fill:url(#hatchBox);stroke:var(--ink);stroke-width:10}
.fl-lam{fill:url(#pLam);stroke:var(--ink);stroke-width:6}
.fl-tile{fill:url(#pTile);stroke:var(--ink);stroke-width:6}

.fl-heat{fill:url(#pHeat);stroke:var(--heat);stroke-width:14;stroke-dasharray:60 30}
.pat-line{stroke:var(--lam);stroke-width:5;opacity:.7}
.pat-tile{stroke:var(--tile);stroke-width:5;fill:none;opacity:.7}
.pat-heat{stroke:var(--heat);stroke-width:9;fill:none}
.pat-hatch{stroke:var(--hatch);stroke-width:7}
.pat-dot{fill:var(--hatch)}
.fl-lab{font-family:var(--f-disp);font-size:120px;fill:var(--ink);font-weight:500}
.fl-sub{font-family:var(--f-mono);font-size:100px;fill:var(--ink2)}
.frame{fill:none;stroke:var(--ink);stroke-width:14}
.stamp line,.stamp rect{stroke:var(--ink);stroke-width:10;fill:none}
.st-s{font-family:var(--f-mono);font-size:92px;fill:var(--ink2);letter-spacing:4px}
.st-m{font-family:var(--f-body);font-size:135px;fill:var(--ink)}
.st-b{font-family:var(--f-disp);font-size:195px;fill:var(--ink);font-weight:500}
.ceil{font-family:var(--f-mono);font-size:100px;fill:var(--ink2)}
/* elevations */
.ev-wall{fill:none;stroke:var(--ink);stroke-width:14}
.ev-end{fill:url(#hatchExt);stroke:var(--ink);stroke-width:10}
.ev-floor{stroke:var(--ink);stroke-width:22}

.ev-box{fill:url(#hatchBox);stroke:var(--ink);stroke-width:9}
.ev-fl{font-family:var(--f-body);font-size:90px;fill:var(--ink2)}
.ev-t{font-family:var(--f-disp);font-size:170px;font-weight:500;fill:var(--ink)}
.ev-s{font-family:var(--f-mono);font-size:95px;fill:var(--ink2)}
.ev-lab{font-family:var(--f-mono);font-size:80px}

.c-plaster{fill:var(--wall2)} .c-putty{fill:var(--sheet)} .c-tile{fill:var(--tile)} .c-wp{fill:var(--cold)} .c-glue{fill:var(--faint)}
.c-gkl{fill:var(--furn)} .c-wood{fill:var(--lam)} .c-under{fill:var(--hatch)}
.c-band{stroke:var(--ink);stroke-width:7}
.c-lead{stroke:var(--ink2);stroke-width:6;fill:none}
.c-dot{fill:var(--ink)}
.c-lab{font-family:var(--f-body);font-size:96px;fill:var(--ink)}
.c-thk{font-family:var(--f-mono);font-size:96px;fill:var(--accent)}
.c-t{font-family:var(--f-disp);font-size:150px;font-weight:500;fill:var(--ink)}
.c-st{font-family:var(--f-mono);font-size:92px;fill:var(--ink2)}
.wall-gkl{fill:url(#pGkl);stroke:var(--ok);stroke-width:16}

.sk-grid img{width:100%;height:auto;border:1px solid var(--rule);border-radius:2px;display:block}

.copy{font:500 12px var(--f-body);background:var(--bg);border:1px solid var(--rule);color:var(--ink);border-radius:3px;padding:3px 8px;cursor:pointer;align-self:flex-start}

.gs{font:120px var(--f-body);fill:var(--ink)} .gs-s{font:92px var(--f-mono);fill:var(--ink2)} .gs-b{font:500 190px var(--f-mono);fill:var(--ink);letter-spacing:6px} .gs-t{font:500 165px var(--f-disp);fill:var(--ink)}
.tb-t{font:500 150px var(--f-disp);fill:var(--ink)} .tb-h{font:500 95px var(--f-mono);fill:var(--ink2)} .tb-c{font:105px var(--f-body);fill:var(--ink)}
.tb-r{fill:none;stroke:var(--ink);stroke-width:10} .tb-l{stroke:var(--ink);stroke-width:5}

.m-front{fill:var(--furn);stroke:var(--ink);stroke-width:8} .m-dark{fill:var(--ink2);stroke:var(--ink);stroke-width:6} .m-top{fill:var(--lam);stroke:var(--ink);stroke-width:6}
.m-dash{fill:none;stroke:var(--ink2);stroke-width:8;stroke-dasharray:50 35} .m-mirror{fill:var(--wall2);stroke:var(--ink);stroke-width:8} .m-lab{font:80px var(--f-body);fill:var(--ink2)}
.sk-note{color:var(--warn);font-size:12px}
.sk-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

<script>

let T3=null,wallH=1200;

function init3D(){

  const box=$('v3d');$('v3dmsg').hidden=true;

  scene.add(new THREE.HemisphereLight(0xffffff,0x9a958c,.75));const sun=new THREE.DirectionalLight(0xfff4e0,.75);sun.position.set(cx3-1,10,-6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30});sun.target.position.set(cx3,0,cz3);scene.add(sun,sun.target);
  const grp=new THREE.Group();scene.add(grp);
  const mats={};const M=(c,o)=>{const k=c+(o||'');return mats[k]||(mats[k]=o?new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:o,roughness:.1}):new THREE.MeshStandardMaterial({color:c,roughness:.85}));};
  const B=(x,z,w,d,y0,y1,c,o)=>{if(w<=0||d<=0||y1<=y0)return;const m=new THREE.Mesh(new THREE.BoxGeometry(w/1000,(y1-y0)/1000,d/1000),M(c,o));m.position.set((x+w/2)/1000,(y0+y1)/2000,(z+d/2)/1000);m.castShadow=!o;m.receiveShadow=true;grp.add(m);};
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:cs.getPropertyValue('--bg').trim()||'#e8ebed',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(cx3,-.03,cz3);ground.receiveShadow=true;scene.add(ground);
  function build(){while(grp.children.length){const c=grp.children.pop();c.geometry.dispose();}
    const flc={lam:'#c9a272',tile:'#c6c8c9',tile2:'#d6d6d4'};
    FL.forEach(f=>{if(f.overlay)return;f.rects.forEach(r=>B(r[0],r[1],r[2],r[3],-25,0,flc[f.key]));});
    ops.filter(o=>o.t!=='win').forEach(o=>{const [x,y,w,h]=gapRect(o);B(x,y,w,h,-25,0,'#b9b4aa');});
    for(const [id,w] of Object.entries(walls)){const [x,y,ww,hh]=w.r;const os=ops.filter(o=>o.w===id).sort((a,b)=>a.a-b.a);const col=w.ext?'#d6d2ca':'#ebe5dc';
      const seg=(a,b,y0,y1,c=col,o)=>{if(w.ax==='x')B(a,y,b-a,hh,y0,y1,c,o);else B(x,a,ww,b-a,y0,y1,c,o);};
      let c=w.ax==='x'?x:y;const end=w.ax==='x'?x+ww:y+hh;

        if(w.ax==='x')B(o.a-60,y+hh,o.b-o.a+120,70,Math.min(o.sill,wallH)-30,Math.min(o.sill,wallH),'#f4f4f2');}
