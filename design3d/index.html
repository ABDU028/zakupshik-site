<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe9e1;--phone:#fbf8f4;--card:#ffffff;--ink:#1d1b19;--mute:#6f6860;--line:#e4ddd3;
  --acc:#b5532c;--acc-ink:#ffffff;--acc-soft:#f6e3d8;--ok:#2f7a4f;--ok-soft:#dcefe3;--warn:#a86a00;--warn-soft:#fbecc9;

  --bub-me:#f1ece6;--bub-me-ink:#1a1917;--bub-ai:#23211f;--bub-mgr:#1f2a38;--plan-bg:#fffdf9;--plan-ink:#1d1b19;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

.btn.full{width:100%}

.row>.btn{flex:1}

.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:84%;padding:9px 12px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}

Как читать:
1) Фото может быть повёрнуто — определи ориентацию по надписям.
2) Рисунок не в масштабе — опирайся только на числа.
3) Квартира = несколько прямоугольников-зон (zones), вплотную, без наложений. Межкомнатная стена = зазор между зонами, равный её толщине (обычно 100–200 мм). Открытое пространство — зоны с одним названием, стыкуются без зазора.
4) Внутренние стены, которых нет как зазоров (пилоны, выступы) — walls; шахты, короба, колонны — blocks.
5) Для каждой зоны укажи h_mm — высоту потолка, если подписана (H=3015 и т.п.), и floor_mm — отметку пола, если отличается (−015 в санузлах).
6) Проёмы: window/door/entry/arch, ширина, отступ; для окон sill_mm (высота подоконника) и height_mm, для дверей height_mm, если подписаны.
7) Радиаторы — radiators (x, y, w, d, comment: размеры и откуда выводы); вентиляционные решётки — vents; стояки — risers (К — канализация, В — вода); щиток — panel с h_mm.

Координаты в мм от левого верхнего внутреннего угла, X вправо, Y вниз. Проёмы привязывай к зоне: стена N/S/W/E + offset_mm от левого (N/S) или верхнего (W/E) угла зоны.

function saveObmer(i){
  const src=Array.isArray(i.zones)?i.zones:Array.isArray(i.rooms)?i.rooms:[];
  let Z=src.map(r=>({name:String(r.name||"Зона").slice(0,40),x:+r.x||0,y:+r.y||0,w:+r.w||0,d:+r.d||0,h_mm:+r.h_mm||null,floor_mm:+r.floor_mm||null})).filter(r=>r.w>100&&r.d>100);
  if(!Z.length)throw new Error("нет zones");
  const bb=bbox(Z);if(bb.w>60000||bb.d>60000)throw new Error("размеры в мм, не больше 60000");
  const dx=-bb.x,dy=-bb.y;Z.forEach(r=>{r.x+=dx;r.y+=dy;});
  const mv=(p,kx,ky)=>{const q=Object.assign({},p);q[kx]=+q[kx]+dx;q[ky]=+q[ky]+dy;return q;};
  const walls=(Array.isArray(i.walls)?i.walls:[]).slice(0,40).map(w=>{let q=mv(w,"x1","y1");q=mv(q,"x2","y2");return{x1:q.x1,y1:q.y1,x2:q.x2,y2:q.y2,t_mm:+w.t_mm||null,kind:w.kind==="bearing"?"bearing":"partition"};}).filter(w=>[w.x1,w.y1,w.x2,w.y2].every(Number.isFinite));
  const blocks=(Array.isArray(i.blocks)?i.blocks:[]).slice(0,20).map(b=>Object.assign(mv(b,"x","y"),{w:+b.w||0,d:+b.d||0,label:String(b.label||"").slice(0,30)})).filter(b=>b.w>0&&b.d>0);
  const pts=(arr,n)=>(Array.isArray(arr)?arr:[]).slice(0,n).map(s=>mv(s,"x","y")).filter(s=>Number.isFinite(s.x)&&Number.isFinite(s.y));
  const warn=[];
  for(let a=0;a<Z.length;a++)for(let b=a+1;b<Z.length;b++){const p=Z[a],q=Z[b];const ix=Math.min(p.x+p.w,q.x+q.w)-Math.max(p.x,q.x),iy=Math.min(p.y+p.d,q.y+q.d)-Math.max(p.y,q.y);if(ix>20&&iy>20)warn.push(`зоны «${p.name}» и «${q.name}» накладываются на ${Math.round(ix)}×${Math.round(iy)} мм`);}
  const ops=(Array.isArray(i.openings)?i.openings:[]).slice(0,50).map(o=>Object.assign({},o,{zone:o.zone||o.room,kind:o.kind==="balcony"?"door":o.kind}));
  ops.forEach(o=>{if(!Z.some(z=>z.name===o.zone))warn.push(`проём ${o.kind||""}: зона «${o.zone}» не найдена`);});
  const ob={zones:Z,walls,blocks,openings:ops,radiators:pts(i.radiators,30),vents:pts(i.vents,20),risers:pts(i.risers,12),panel:i.panel&&i.panel.x!=null?mv(i.panel,"x","y"):null,ceiling_mm:+i.ceiling_mm||null,notes:String(i.notes||"").slice(0,800)};
  let ar=Z.reduce((s,r)=>s+r.w*r.d,0);blocks.forEach(b=>{if(inZ(Z,b.x+b.w/2,b.y+b.d/2))ar-=b.w*b.d;});
  ob.area=Math.round(ar/1e5)/10;ob.total_w_mm=Math.round(bbox(Z).w);ob.total_d_mm=Math.round(bbox(Z).d);
  S.obmer=ob;S.planVer=(S.planVer||0)+1;obmerTouched=true;delete S.since.obmer;S.ok.obmer=false;save();render(false);
  const by={};Z.forEach(r=>{by[r.name]=(by[r.name]||0)+r.w*r.d/1e6;});
  const names={N:"верхняя",S:"нижняя",W:"левая",E:"правая"};
  const outlineInfo=chains(ob).map(s=>({wall:names[s.side]+" наружная стена",at:Math.round(s.c),from:Math.round(s.a),length:Math.round(s.b-s.a),pieces:s.pieces.map(p=>(p.op?"проём ":"")+p.len)}));
  return{ok:true,area_m2:ob.area,shape:`габарит ${ob.total_w_mm}×${ob.total_d_mm}`,rooms:Object.entries(by).map(([n,a])=>({name:n,area_m2:Math.round(a*10)/10})),outline:outlineInfo,warnings:warn};
}

function turns(){
  const out=[{role:"user",content:rules()},{role:"assistant",content:"Понял, работаю по правилам."}];
  const hist=S.chat.filter(m=>["me","ai","mgr"].includes(m.role)||(m.role==="sys"&&/^✓/.test(m.text||""))).slice(-40);
  hist.forEach(m=>{
    const role=m.role==="me"||m.role==="sys"?"user":"assistant";
    let c=m.role==="mgr"?`[Менеджер]: ${m.text}`:m.role==="sys"?`[Приложение: ${m.text}]`:(m.text||"");
    if(m.imgs&&m.role==="me")c=(c?c+"\n":"")+`[клиент приложил ${m.imgs} фото${m.kind==="frame"?" (кадры видео-обхода)":""}]`;
    else if(m.img&&m.role==="me")c=(c?c+"\n":"")+"[клиент прислал фото]";
    if(!c.trim())c="…";
    const last=out[out.length-1];
    if(last.role===role)last.content+="\n\n"+c;else out.push({role,content:c});
  });
  if(out[out.length-1].role!=="user")out.push({role:"user",content:"(клиент ждёт ответа)"});
  return out;
}
async function runAgent(note,extraImgs,label){
  busy=true;startLive(label||t("typing"));render();
  const ph=photoActive();
  ctl=new AbortController();let ok=false;
  try{
    const tt=turns();
    if(note)tt[tt.length-1].content+="\n\n"+note;
    const imgs=[];
    if(ph){S.photos.forEach(p=>imgs.push(dataBlob(p)));tt[tt.length-1].content+=`\n\n[К запросу приложены фото плана квартиры: ${S.photos.length} шт.]`;}
    (extraImgs||[]).forEach(b=>{if(imgs.length<8)imgs.push(b);});
    if(extraImgs&&extraImgs.length)tt[tt.length-1].content+=`\n\n[К этому сообщению клиент приложил ${extraImgs.length} изображ.]`;
    const opts={signal:ctl.signal,modelTier:imgs.length?"vision":"default",onText:({text})=>{const el=document.getElementById("live");if(el){el.classList.remove("typing");el.innerHTML=md(text,false);scrollChat();}}};
    if(limits&&limits.tools)opts.tools=TOOLS();else opts.cache=false;
    if(imgs.length)opts.images=imgs;
    const r=await sample(tt,opts);
    addMsg({role:"ai",text:r.text.trim()+(r.truncated?"\n\n("+t("cut")+")":"")});ok=true;
  }catch(e){
    if(e&&e.text)addMsg({role:"ai",text:e.text});
    const c=e&&e.code;
    if(c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled"||c==="capability_removed"){addMsg({role:"sys",text:t("err_deny")});sample=null;}
    else if(c==="rate_limited")addMsg({role:"sys",text:t("err_rate")});
    else if(c==="no_credits"){addMsg({role:"sys",text:t("err_credits")});sendRequest("support",{note:"ИИ недоступен: закончились кредиты Anthropic"});}
    else if(c==="image_rejected"||c==="images_unavailable")addMsg({role:"sys",text:t("err_img")});
    else if(c!=="cancelled")addMsg({role:"sys",text:t("err_gen")+(c?" ("+c+")":""),retry:true});
  }
  pendingCards.forEach(addMsg);pendingCards=[];
  busy=false;ctl=null;stopLive();render();return ok;
}
async function verifyPlan(){
  busy=true;startLive(t("checking"));render();ctl=new AbortController();
  try{
    const png=await svgToPng(planSVG(S.obmer,{px:1600}));
    const imgs=S.photos.map(dataBlob);imgs.push(png);
    const v=await sample.json(`Изображения 1–${S.photos.length} — план квартиры от клиента (рисунок от руки или обмер; фото может быть повёрнуто). Последнее изображение — обмерный план, построенный по нему (размеры в мм, синие цифры — проёмы).
Сравни с учётом поворота: 1) форму квартиры — углы, выступы, ниши; 2) где есть внутренние стены и где их нет; 3) положение и ширину окон и дверей; 4) стояки, шахты, короба, радиаторы; 5) каждый размер, подписанный на исходнике, — есть ли на плане и совпадает ли.
Ответь только JSON: {"ok": true или false, "issues": ["конкретное расхождение с цифрами"]}. ok=false только при реальных ошибках: другая форма, лишняя или пропущенная стена, проём не там, размер отличается больше чем на 50 мм.`,{images:imgs,modelTier:"vision",cache:false,signal:ctl.signal});
    if(v&&v.ok===false&&Array.isArray(v.issues))return v.issues.map(String).slice(0,8);
    return [];
  }catch(e){return [];}
  finally{busy=false;ctl=null;stopLive();}
}
async function send(text,opt){
  opt=opt||{};
  text=(text||"").trim();
  const imgs=pending.slice();pending=[];
  if(!text&&!imgs.length)return;
  if(S.mgrMode){addMsg({role:"mgr",text});render();return;}
  const kind=imgs.length?imgs[0].kind:null;
  // фото плана до утверждения обмера сохраняем — они нужны ИИ на каждом шаге
  if(imgs.length&&kind!=="frame"&&!S.ok.obmer&&!opt.reference){S.photos=imgs.map(p=>p.keep).slice(0,4);}
  addMsg({role:"me",text:text||"",img:imgs.length?imgs[0].thumb:null,imgs:imgs.length||0,kind});
  if(!sample){render();return;}
  obmerTouched=false;
  const oneOff=(kind==="frame"||S.ok.obmer||opt.reference)?imgs.map(p=>p.blob):[];
  const label=imgs.length&&!S.ok.obmer?t("st_read"):photoActive()?t("st_think_plan"):t("typing");
  const ok=await runAgent(kind==="frame"?"[Это кадры видео-обхода квартиры по порядку. Используй их, чтобы проверить план: стены, проёмы, стояки, радиаторы, высоты.]":"",oneOff,label);
  if(ok&&obmerTouched&&photoActive()&&sample){
    const issues=await verifyPlan();
    if(issues.length){obmerTouched=false;await runAgent("[Автосверка плана с фото нашла расхождения: "+issues.join("; ")+". Проверь по фото. Где автосверка права — исправь через save_obmer и снова вызови request_approval. Клиенту коротко скажи, что поправил. Если не уверен — спроси клиента.]",[],t("st_fix"));}
    else render();
  }
}
function sendRequest(kind,extra){
  const d=Object.assign({kind,name:S.name,phone:S.phone,stage:(current()||{}).id||"done",project:{area:area(),obmer:!!S.obmer,brief_coverage:Math.round(coverage()*100),last:S.chat.filter(m=>m.role==="me"||m.role==="ai").slice(-6).map(m=>(m.role==="me"?"К: ":"ИИ: ")+String(m.text||"").slice(0,300))}},extra||{});
  S.reqs=(S.reqs||[]).concat([{kind,at:now()}]);save();
  if(window.D3K_API)return window.D3K_API.request(d).catch(()=>null);
  return Promise.resolve(null);
}

function pencil(){
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280-.5;};
  const ln=(x1,y1,x2,y2,w)=>{const n=6;let d=`M${x1+rnd()*2} ${y1+rnd()*2}`;for(let i=1;i<=n;i++){const t0=i/n;d+=` L${x1+(x2-x1)*t0+rnd()*2.2} ${y1+(y2-y1)*t0+rnd()*2.2}`;}return `<path d="${d}" fill="none" stroke="#33415c" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round"/>`;};
  const tx=(x,y,s,r,sz,c)=>`<text x="${x}" y="${y}" font-size="${sz||13}" fill="${c||"#1f4fbf"}" font-family="Caveat,'Comic Sans MS',cursive"${r?` transform="rotate(${r} ${x} ${y})"`:""} text-anchor="middle">${s}</text>`;
  let g="";
  // контур: две комнаты + коридор
  [[30,30,330,30],[330,30,330,230],[330,230,30,230],[30,230,30,30],[30,32,328,32],[180,30,180,150],[180,190,180,230],[30,150,180,150]].forEach(a=>{g+=ln(...a,a===undefined?2:2.2);});
  g+=ln(28,28,332,28,1)+ln(332,28,332,232,1)+ln(332,232,28,232,1)+ln(28,232,28,28,1);
  // окна (разрыв + двойная линия)
  g+=`<rect x="80" y="24" width="60" height="12" fill="#fff"/>`+ln(80,27,140,27,1.4)+ln(80,33,140,33,1.4);
  g+=`<rect x="230" y="24" width="60" height="12" fill="#fff"/>`+ln(230,27,290,27,1.4)+ln(230,33,290,33,1.4);
  // дверь входная
  g+=`<rect x="70" y="225" width="40" height="12" fill="#fff"/>`+ln(70,230,70,190,1.6)+`<path d="M70 190 Q102 194 110 230" fill="none" stroke="#33415c" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  // стояк, щиток, радиатор
  g+=`<circle cx="315" cy="215" r="6" fill="none" stroke="#33415c" stroke-width="1.8"/>`+tx(298,220,"ст",0,12);
  g+=`<rect x="38" y="200" width="16" height="10" fill="none" stroke="#33415c" stroke-width="1.6"/>`+tx(46,196,"щит",0,12);
  g+=ln(90,42,130,42,3)+tx(110,56,"радиатор 1000",0,11);
  // размеры
  g+=ln(30,12,330,12,1)+tx(180,10,"7000",0,15);
  g+=ln(14,30,14,230,1)+tx(10,130,"4800",-90,15);
  g+=tx(110,20,"окно 1500 · от угла 500",0,11)+tx(260,20,"окно 1500",0,11);
  g+=tx(105,100,"Комната 1",0,15,"#33415c")+tx(105,118,"h = 2700",0,13)+tx(255,120,"Кухня-гостиная",0,15,"#33415c")+tx(255,138,"h = 2700",0,13);
  g+=tx(105,180,"Коридор",0,14,"#33415c")+tx(90,248,"дверь 900",0,12)+tx(105,165,"3500",0,12)+tx(190,85,"2600",-90,12);
  return `<svg viewBox="0 0 350 260" class="pencil" role="img" aria-label="пример рисунка"><rect width="350" height="260" fill="#fbfaf4"/>${Array.from({length:13},(_,i)=>`<line x1="0" y1="${i*20+10}" x2="350" y2="${i*20+10}" stroke="#dfe6f0" stroke-width=".6"/>`).join("")}${g}</svg>`;
}

async function shrink(file,max,q){const u=URL.createObjectURL(file);try{const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u;});const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q);}finally{URL.revokeObjectURL(u);}}
async function addImages(files,kind){
  const arr=Array.from(files).slice(0,4);
  for(const f of arr){try{const keep=await shrink(f,1800,.85);const thumb=await shrink(f,400,.7);pending.push({blob:dataBlob(keep),keep,thumb,kind:kind||"photo"});}catch(e){toast(t("err_img"));}}
  render();
}
async function videoFrames(file,n){
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";const u=URL.createObjectURL(file);v.src=u;
  await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=j;setTimeout(j,15000);});
  const out=[];const dur=v.duration||10;
  for(let i=0;i<n;i++){
    v.currentTime=Math.min(dur-0.1,dur*(i+.5)/n);
    await new Promise(r=>{v.onseeked=r;setTimeout(r,4000);});
    const s=Math.min(1,1280/Math.max(v.videoWidth||1280,v.videoHeight||720));const c=document.createElement("canvas");c.width=Math.round((v.videoWidth||1280)*s);c.height=Math.round((v.videoHeight||720)*s);c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    const keep=c.toDataURL("image/jpeg",.75);const tc=document.createElement("canvas");tc.width=240;tc.height=Math.round(240*c.height/c.width);tc.getContext("2d").drawImage(c,0,0,tc.width,tc.height);
    out.push({blob:dataBlob(keep),keep,thumb:tc.toDataURL("image/jpeg",.6),kind:"frame"});
  }
  URL.revokeObjectURL(u);return out;
}

function openZoom(src){zw=100;const v=document.createElement("div");v.className="zv";v.innerHTML=`<div class="zc"><button data-z="x" style="width:auto;padding:0 14px;border-radius:21px;margin-right:auto;font-size:15px">← ${t("back")}</button><button data-z="-">−</button><button data-z="+">+</button></div><img src="${src}" alt="">`;v.addEventListener("click",ev=>{const z=ev.target.closest("[data-z]");if(!z)return;ev.stopPropagation();if(z.dataset.z==="x"){closeZoom();return;}zw=Math.max(100,Math.min(400,zw+(z.dataset.z==="+"?75:-75)));v.style.setProperty("--zw",zw+"%");});document.getElementById("app").appendChild(v);pushH();}
function closeZoom(){const v=document.querySelector(".zv");if(v)v.remove();}
let pickKind="photo";
document.getElementById("app").addEventListener("click",e=>{
  if(e.target.closest(".zv"))return;
  const zi=e.target.closest("img[data-zoom]");if(zi){openZoom(zi.src);return;}
  if(e.target.closest(".plan")&&S.obmer){openZoom("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(planSVG(S.obmer,{px:2600})));return;}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,k=b.dataset.k;
  if(b.tagName==="A")return;
  switch(a){
   case"lang":S.lang=k;save();render();break;
   case"theme":S.theme=k;save();applyTheme();render();break;
   case"start":if(!phoneOk(S.phone)){toast(t("phoneNeed"));break;}S.started=true;S.offer=true;save();sendRequest("support",{note:"Новый клиент начал проект"});navStack=["home"];pushH();tab="chat";render();break;
   case"enter":navStack=["home"];pushH();tab="chat";render();break;
   case"tab":if(k!==tab){navStack.push(tab);pushH();}tab=k;modal=null;render();break;
   case"back":goBack();break;
   case"send":doSend();break;
   case"stop":if(ctl)ctl.abort();break;
   case"qr":if(!busy){draft="";send(k);}break;
   case"retry":{const lastMe=[...S.chat].reverse().find(m=>m.role==="me");S.chat.pop();save();if(lastMe&&sample){runAgent("",[],photoActive()?t("st_think_plan"):t("typing"));}break;}
   case"att":pickKind=k||"photo";modal=null;render();if(limits&&limits.images){const inp=document.getElementById("photo");inp.accept="image/*";inp.multiple=true;inp.click();}else toast(t("noSample"));break;
   case"pickvideo":modal=null;render();{const inp=document.getElementById("photo");inp.accept="video/*";inp.multiple=false;pickKind="video";inp.click();}break;
   case"unimg":pending=[];render();break;
   case"chat":if(tab!=="chat"){navStack.push(tab);pushH();}tab="chat";render();break;
   case"approve":approve(k);break;
   case"revise":revise(k);break;
   case"revsend":{const v=(document.getElementById("f_rev")||{}).value||"";if(v.trim().length<3){toast(t("revNeed"));break;}doRevise(modal.key,v.trim());break;}
   case"pay":pay(+k);break;
   case"var":S.variant=k;save();render();break;
   case"shok":if(sheetUI)sheetUI.fn();break;
   case"shclose":if(b.classList.contains("sheetbg")&&e.target!==b)return;sheetUI=null;render();break;
   case"mclose":if(b.classList.contains("sheetbg")&&e.target!==b)return;modal=null;render();break;
   case"support":modal={kind:"support"};pushH();render();break;
   case"form":modal={kind:"form",k};render();break;
   case"zamer":modal={kind:"form",k:"zamer"};pushH();render();break;
   case"fsend":{const g=id=>((document.getElementById(id)||{}).value||"").trim();const ph=g("f_phone");if(!phoneOk(ph)){toast(t("phoneNeed"));break;}S.phone=ph;if(g("f_name"))S.name=g("f_name");if(k==="zamer"){S.city=g("f_city");S.addr=g("f_addr");}save();
     sendRequest(k,{name:S.name,phone:ph,city:g("f_city")||null,address:g("f_addr")||null,when:g("f_when"),note:g("f_note")});modal=null;addMsg({role:"sys",text:k==="zamer"?t("zamerOk"):t("callbackOk")});render();toast(k==="zamer"?t("zamerOk"):t("callbackOk"));break;}
   case"mgrchat":modal=null;S.mgrCalled=true;sendRequest("manager",{note:"Клиент просит менеджера в чат"});addMsg({role:"sys",text:t("mgrCalled")});save();if(tab!=="chat"){navStack.push(tab);pushH();}tab="chat";render();break;
   case"faqgo":modal=null;if(tab!=="more"){navStack.push(tab);pushH();}tab="more";render();break;
   case"guide":modal={kind:"guide"};pushH();render();break;
   case"video":modal={kind:"video"};pushH();render();break;
   case"newproj":modal={kind:"newproj"};render();break;
   case"newok":{const keep={lang:S.lang,theme:S.theme,name:S.name,phone:S.phone,offer:S.offer,admin:S.admin};S=Object.assign(fresh(),keep);save();modal=null;tab="home";openStage=null;render();toast(t("newProjDone"));break;}
   case"ask":if(stageStatus("brief")==="locked"||stageStatus("brief")==="pay"){toast(t("briefLocked"));break;}navStack.push(tab);pushH();tab="chat";draft=t("letsTalk")+": "+k.toLowerCase();render();{const ta=document.getElementById("ta");if(ta)ta.focus();}break;
   case"editroom":navStack.push(tab);pushH();tab="chat";draft=t("changeIn").replace("{x}",k);render();{const ta=document.getElementById("ta");if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}}break;
   case"mic":toggleVoice();break;
   case"xlsx":dl("vedomost-materialov-56.xlsx",b64blob(XLSX_B64,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"),"xlsx");break;
   case"svg":if(S.obmer)dl("obmernyj-plan.svg",planSVG(S.obmer,{full:true}),"svg");break;
   case"json":dl("proekt.json",JSON.stringify({obmer:S.obmer,brief:S.brief,covered:S.covered,approved:S.ok,variant:S.variant,revisions:S.rev,paid:S.paid},null,2),"json");break;
   case"adm":admTaps=(admTaps||0)+1;if(admTaps>=7){admTaps=0;S.admin=!S.admin;save();render();toast(S.admin?"Админ: вкл":"Админ: выкл");}break;
   case"shift":S.shift+=2*864e5+3600e3;save();render();toast("+2 "+t("days"));break;
  }
});
document.getElementById("photo").addEventListener("change",async e=>{
  const fs=Array.from(e.target.files||[]);e.target.value="";if(!fs.length)return;
  if(pickKind==="video"){toast(t("framesWait"));try{const fr=await videoFrames(fs[0],6);pending=fr;render();draft=draft||t("videoMsg");render();}catch(err){toast(t("videoErr"));}return;}
  await addImages(fs,"photo");
  if(pickKind==="ready"&&!draft)draft=t("readyMsg");
  if(pickKind==="draw"&&!draft)draft=t("drawMsg");
  render();
});
/* заставка */
(function(){const el=document.getElementById("intro");if(!el)return;let seen=false;try{seen=sessionStorage.getItem("d3kIntro")==="1";}catch(e){}
  if(seen){el.remove();return;}
  const fn=document.getElementById("introName");if(fn)fn.textContent=FOUNDER;
  const done=()=>{el.classList.add("out");setTimeout(()=>el.remove(),450);try{sessionStorage.setItem("d3kIntro","1");}catch(e){}};
  el.addEventListener("click",done);setTimeout(done,2800);})();
const _render=render;
render=function(full){if(full===false){if(tab!=="chat")_render();return;}_render();};
_render();
})();
</script>
</body></html>
