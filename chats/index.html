<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Закупщик · Чаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1215;--bg2:#0B0E10;--s1:#161A1E;--s2:#1C2126;--s3:#23282E;--s4:#2C3036;--fg:#ECEDEE;--mut:#9AA1A9;--mut2:#737B84;--acc:#F06A2A;--accS:#3A2418;--accT:#F2A27A;
--grn:#2FB36D;--grnBg:#12301F;--grnT:#8FE0B0;--yel:#F59E0B;--yelBg:#3A2E12;--yelT:#FCD34D;--org:#FDBA74;--orgBg:#3A2810;--red:#EF4444;--redBg:#3A1D1D;--redT:#FCA5A5;--blu:#4EA3FF;--bluBg:#1E2A3A;--bluT:#9CC8FF}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:500 14px/1.45 Manrope,system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:flex;height:100vh}
.rail{width:64px;flex-shrink:0;border-right:1px solid var(--s3);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.rail .logo{font-weight:800;font-size:20px;color:var(--acc);margin-bottom:8px}
.rail button,.rail a{position:relative;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;text-decoration:none}
.rail .on{background:var(--s3);color:var(--fg)}
.rail .badge{position:absolute;top:3px;right:3px;min-width:18px;height:18px;border-radius:9px;background:var(--grn);color:#06210F;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.rail .sp{flex:1}
svg{flex-shrink:0}
/* list */
.list{width:370px;flex-shrink:0;border-right:1px solid var(--s3);display:flex;flex-direction:column;min-width:0}
.lh{padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
.lh h1{margin:0;font-size:21px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.lh h1 small{font-size:12px;color:var(--mut);font-weight:600}
.search{height:40px;border-radius:12px;border:0;background:var(--s2);padding:0 14px;width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:30px;padding:0 11px;border:0;border-radius:15px;background:var(--s2);color:#C9CDD2;font-weight:700;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--grnBg);color:var(--grnT)}
.seg button{display:inline-flex;align-items:center}
.seg button .n{opacity:.65;margin-left:4px}
.mine{display:flex;gap:7px;white-space:nowrap;align-items:center;font-size:12.5px;color:var(--mut);font-weight:700;cursor:pointer}
.mine input{width:16px;height:16px;accent-color:var(--grn)}
.row.snz{opacity:.55}
.row.pk{background:var(--redBg)}
.ckb{width:22px;height:22px;flex-shrink:0;align-self:center;border-radius:6px;border:2px solid var(--s4);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.row.pk .ckb{background:var(--red);border-color:var(--red)}
.pillb[disabled]{opacity:.4;cursor:default}
.rows{flex:1;overflow-y:auto}
.row{display:flex;gap:11px;padding:11px 14px;width:100%;text-align:left;border:0;background:transparent;border-bottom:1px solid #191D21}
.row:hover{background:#171B1F}
.row.sel{background:var(--s2)}
.av{width:46px;height:46px;flex-shrink:0;border-radius:23px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.r1{display:flex;justify-content:space-between;gap:8px}
.r1 b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 .t{font-size:11.5px;color:var(--mut);white-space:nowrap}
.r1 .t.hot{color:var(--grn);font-weight:700}
.r1 .t.urg{color:var(--redT);font-weight:700}
.r2{font-size:12.5px;color:#C9CDD2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.r3 span:first-child{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r3 .urg{color:var(--redT)}
.cnt{min-width:20px;height:20px;border-radius:10px;background:var(--grn);color:#06210F;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.cnt.red{background:var(--red);color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--s3);color:#C9CDD2;white-space:nowrap}
.c-yel{background:var(--yelBg);color:var(--yelT)}.c-grn{background:var(--grnBg);color:var(--grnT)}.c-org{background:var(--orgBg);color:var(--org)}.c-red{background:var(--redBg);color:var(--redT)}.c-blu{background:var(--bluBg);color:var(--bluT)}.c-acc{background:var(--accS);color:var(--accT)}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
/* chat */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg2)}
.ch{height:64px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--s3);background:var(--s1)}
.ch .av{width:40px;height:40px;font-size:14px}
.chm{flex:1;min-width:0;display:flex;flex-direction:column}
.chm b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chm b span{color:var(--mut);font-weight:600;font-size:12.5px}
.chm small{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillb{height:36px;padding:0 13px;border-radius:18px;border:0;background:var(--s3);color:var(--fg);font-weight:700;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.pillb.g{background:var(--grnBg);color:var(--grnT)}
.pillb.a{background:var(--acc);color:#fff}
select.pillb{appearance:none;-webkit-appearance:none;padding-right:13px}
.ib{width:36px;height:36px;border-radius:18px;border:0;background:var(--s3);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.msgs{flex:1;overflow-y:auto;padding:16px 26px;display:flex;flex-direction:column;gap:8px}
.msgs>*{flex-shrink:0}
.day{align-self:center;font-size:11.5px;color:var(--mut);background:var(--s2);padding:4px 11px;border-radius:9px;margin:6px 0}
.b{position:relative;max-width:64%;padding:7px 11px 6px;border-radius:13px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.cl{align-self:flex-start;background:var(--s2);border-bottom-left-radius:4px}
.b.mg{align-self:flex-end;background:#3A2418;border-bottom-right-radius:4px}
.b.ai{align-self:flex-end;background:var(--bluBg);border-bottom-right-radius:4px}
.b .who{font-size:11px;font-weight:800;color:var(--bluT)}
.b.mg .who{color:var(--accT)}
.b .tm{align-self:flex-end;font-size:10.5px;color:var(--mut);white-space:nowrap}
.tk{font-weight:800;letter-spacing:-2px;margin-left:3px}.tk.r{color:var(--blu)}
.sys{align-self:center;max-width:80%;text-align:center;font-size:12px;color:var(--mut);background:var(--s1);padding:5px 11px;border-radius:9px}
.sys.g{color:var(--grnT);background:var(--grnBg)}
.del{font-style:italic;color:var(--mut2);font-size:12.5px;padding:5px 10px;border:1px dashed var(--s4);border-radius:10px}
.del.cl{align-self:flex-start}.del.mg{align-self:flex-end}
.card{position:relative;align-self:flex-end;width:min(100%,430px);border-radius:15px;background:var(--s1);border:2px solid var(--s4);overflow:hidden}
.card.kp{border-color:var(--acc)}.card.var{border-color:var(--yel)}.card.ex{border-color:var(--blu)}.card.dp{border-color:var(--s4);background:#101418}
.card .in{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .hd b{font-size:13.5px}.card .hd span{font-size:11px;color:var(--mut)}
.vr{display:flex;gap:10px;align-items:center}
.th{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--s3);flex-shrink:0}
.vm{flex:1;min-width:0;display:flex;flex-direction:column}
.vm b{font-size:13px}.vm small{font-size:11.5px;color:var(--mut);white-space:pre-line}
.vr .pr{font-weight:800;font-size:13.5px;white-space:nowrap}
.kv2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#C9CDD2}
.kv2.tot{font-size:14px;font-weight:800;color:var(--fg)}
.foot{padding:6px 12px;font-size:12px;font-weight:700;background:var(--s3);color:#C9CDD2}
.foot.g{background:var(--grnBg);color:var(--grnT)}.foot.r{background:var(--redBg);color:var(--redT)}
.media{display:flex;gap:6px;flex-wrap:wrap}
.media img{width:150px;height:150px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.media video{width:240px;border-radius:10px;background:#000}
.media audio{max-width:260px}
.media a.doc{display:inline-flex;gap:6px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--s3);color:var(--fg);text-decoration:none;font-size:13px}
.x{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:13px;border:1px solid var(--s4);background:var(--s1);color:var(--redT);display:none;align-items:center;justify-content:center;padding:0}
.b:hover .x,.card:hover .x{display:flex}
.sug{margin:0 16px 8px;border:1.5px dashed var(--blu);border-radius:13px;padding:9px 11px;background:#121A24;display:flex;gap:10px;align-items:flex-start}
.sug .t{flex:1;display:flex;flex-direction:column;gap:3px}
.sug .t small{font-size:11.5px;font-weight:800;color:var(--bluT)}
.sug .t span{font-size:13.5px;white-space:pre-wrap}
.sug .bb{display:flex;gap:6px;flex-shrink:0}
.sb{height:34px;padding:0 11px;border-radius:9px;border:0;background:var(--blu);color:#061423;font-weight:800;font-size:12.5px}
.sb.gh{background:transparent;border:1px solid #2C3540;color:var(--fg)}
.comp{display:flex;align-items:flex-end;gap:7px;padding:8px 16px 14px;position:relative}
.cb{width:44px;height:44px;flex-shrink:0;border-radius:22px;border:0;background:var(--s3);color:var(--fg);display:flex;align-items:center;justify-content:center}
.cb.plus{background:var(--acc);color:#fff;font-size:26px;line-height:1}
.cb.rec{background:var(--red);color:#fff}
.ta{flex:1;min-width:0;min-height:44px;max-height:160px;border-radius:22px;border:0;background:var(--s2);padding:11px 16px;resize:none}
.menu{position:absolute;left:16px;bottom:66px;width:330px;background:var(--s2);border:1px solid var(--s4);border-radius:16px;padding:7px;display:flex;flex-direction:column;gap:2px;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:5}
.menu button{display:flex;gap:11px;align-items:center;padding:9px;border-radius:11px;border:0;background:transparent;text-align:left}
.menu button:hover{background:var(--s3)}
.menu .mi{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.menu b{display:block;font-size:13.5px}.menu small{font-size:11.5px;color:var(--mut)}
.tpl{position:absolute;left:120px;right:70px;bottom:66px;background:var(--s2);border:1px solid var(--s4);border-radius:14px;padding:6px;max-height:280px;overflow:auto;z-index:5}
.tpl button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:13px}
.tpl button:hover{background:var(--s3)}
.nochat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mut)}
/* info */
.info{width:300px;flex-shrink:0;border-left:1px solid var(--s3);background:var(--s1);padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.info h3{margin:0;font-size:14px}
.info .f{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.info .f span{color:var(--mut)}
.info hr{border:0;border-top:1px solid var(--s3);margin:2px 0;width:100%}
.stp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.stp li{display:flex;gap:8px;align-items:center;color:var(--mut2)}
.stp li i{width:9px;height:9px;border-radius:5px;border:1.5px solid #4A5159}
.stp li.d{color:#C9CDD2}.stp li.d i{background:var(--grn);border-color:var(--grn)}
.stp li.c{color:var(--yelT);font-weight:800}.stp li.c i{background:var(--yel);border-color:var(--yel)}
.payr{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.payr .ok{color:var(--grnT);font-weight:700}.payr .no{color:var(--org)}
.note{width:100%;border-radius:10px;border:1px solid var(--s4);background:var(--bg);padding:8px;font-size:13px;resize:vertical;min-height:60px}
/* sheet */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;justify-content:flex-end}
.sheet{width:min(540px,100vw);height:100%;background:var(--s1);border-left:1px solid var(--s4);display:flex;flex-direction:column}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--s3)}
.sh-h b{font-size:17px}
.sh-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sh-f{padding:12px 18px 18px;border-top:1px solid var(--s3);display:flex;gap:8px}
.box{background:var(--s2);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:9px}
.box .bh{display:flex;justify-content:space-between;align-items:center}
.lab{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:700;min-width:0}
.inp{height:42px;border-radius:10px;border:1px solid var(--s4);background:var(--bg);padding:0 10px;font-size:14.5px;font-weight:700;width:100%}
textarea.inp{height:auto;min-height:62px;padding:8px 10px;font-weight:500;font-size:13.5px;resize:vertical}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--mut)}
.tot b{font-size:18px;color:var(--accT)}
.ph{display:flex;gap:6px;flex-wrap:wrap}
.ph div{position:relative}
.ph img,.ph .fd{width:60px;height:60px;border-radius:9px;object-fit:cover;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:3px;overflow:hidden}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:#000;color:#fff;font-weight:800;line-height:1;padding:0}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{height:34px;padding:0 13px;border-radius:17px;border:0;background:var(--s3);font-weight:700;font-size:13px}
.opts button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.prev{border:1.5px dashed #3A4048;border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:5px}
.prev .cap{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.06em}
.bigb{flex:1;height:50px;border-radius:13px;border:0;background:var(--acc);color:#fff;font-weight:800;font-size:15px}
.bigb.g{background:var(--grn);color:#06210F}
.ghb{height:50px;padding:0 16px;border-radius:13px;border:1px solid var(--s4);background:transparent;font-weight:700}
.chk{display:flex;gap:10px;align-items:center;padding:10px;border-radius:11px;background:var(--s2);font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--grn)}
.stg{display:flex;flex-direction:column;gap:6px}
.stg button{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:11px;border:1px solid var(--s4);background:var(--s2);text-align:left;font-weight:700}
.stg button.nx{border-color:var(--acc);background:var(--accS)}
.stg button[disabled]{opacity:.45;cursor:default}
/* board */
.board{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px 22px;gap:14px;overflow:hidden}
.board h1{margin:0;font-size:21px}
.cols{flex:1;display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;min-height:0;overflow-x:auto}
.col{background:var(--s1);border-radius:15px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto}
.col .chd{display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;padding:2px 2px 4px}
.col.pay{outline:2px solid var(--yel);outline-offset:-2px}
.bc{border:0;text-align:left;background:var(--s2);border-radius:11px;padding:9px;display:flex;flex-direction:column;gap:3px}
.bc b{font-size:13px}.bc small{font-size:11.5px;color:var(--mut)}
.bc.paid{background:#12261A}.bc.wait{background:#2A2010}
/* misc */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lb img{max-width:94vw;max-height:92vh}
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gate form{width:100%;max-width:360px;background:var(--s1);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.err{color:var(--redT);font-weight:700;font-size:13px}
@media (max-width:1250px){.info{display:none}.info.force{display:flex;position:fixed;right:0;top:0;bottom:0;z-index:15;box-shadow:-10px 0 30px rgba(0,0,0,.5)}}
@media (max-width:820px){#backBtn{display:inline-flex!important}.ch select.pillb,.ch a.pillb{display:none}.ch{padding:0 8px;gap:6px}.msgs{padding:12px}.b{max-width:85%}.list{width:100%}.app.open .list{display:none}.app:not(.open) .chat{display:none}.rail{display:none}}
</style>
</head>

function sheetPay(r) {

function sheetStage(r) {

  const curI = list.indexOf(r.stage);

  let mode = null;

  ['way', 'Китай → в пути', (r) => r.status === 'work' && !awaitingPay(r) && !delivDue(r) && ['paid', 'bought', 'wait_china', 'china', 'transit'].includes(r.stage || 'paid') && r.stage !== 'almaty'],
